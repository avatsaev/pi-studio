name: Release

# Runs the exact same pipeline as `npm run release` locally: publish the npm packages, build +
# push Docker images tagged to match, then pin + deploy relay/web-client to production on Dokploy.
# See scripts/release.sh (and AGENTS.md's "Release & production deployment" section) for what each
# step actually does — this workflow adds no new logic, it just runs those scripts on a runner.
#
# Triggers ONLY on a push (including a merged PR, which GitHub delivers as a push) to `main`. Every
# such push is a new release, like the desktop app's (desktop-release.yml): the version is computed
# on the runner from what npm has (step `Next version`), never committed back, so there is no
# version-bump commit and nothing to pull after a release. The version committed in
# packages/*/package.json is a floor; raise it with `npm run version:set` for a minor or major release.
#
# A push that touches only the desktop client (`desktop/`) is not a release: that directory is not
# part of any npm package or Docker image, and its gate is desktop-ci.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - "desktop/**"
      - ".github/workflows/desktop-*.yml"

# Serialize releases if two pushes land close together (e.g. two PRs merged back-to-back) rather
# than letting two releases race each other.
concurrency:
  group: release-main
  cancel-in-progress: false

# `id-token: write` lets `npm publish` exchange the GitHub OIDC token for a short-lived publish
# credential (npm trusted publishing) — no long-lived NPM_TOKEN is used. Each published package
# must have this repo + workflow (release.yml) registered as a Trusted Publisher on npmjs.com.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ github.sha }}
    env:
      # Not secret — already documented in this repo's AGENTS.md / docker/README.md.
      DOKPLOY_URL: https://infra.molagent.ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; don't rely on whatever the runner image bundles.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: npm ci

      # The committed version is only a floor (scripts/release/version.mjs): the release is the patch
      # after the highest version npm has for any published package, or the floor when that is
      # higher. It is written into this runner's copy only; nothing is committed back. Fails when
      # npm cannot answer, rather than risk reusing a version.
      - name: Next version
        id: version
        run: |
          node scripts/set-version.mjs next
          echo "version=$(node -p "require('./packages/protocol/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Docker Hub login
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Release (npm publish -> docker publish -> dokploy deploy)
        run: npm run release
        env:
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}

      # Retry against the propagation window: Dokploy reports "deployed successfully" once the
      # new container is healthy, but the reverse proxy in front of it can take a few seconds to
      # start routing to it — a single immediate curl can catch a stale/404 response even though
      # the deploy itself succeeded (observed 2026-07-29, run #30467116815).
      - name: Verify production
        run: |
          curl -sf https://relay.molagent.ai/health && echo
          curl -sf --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null \
            -w "app.molagent.ai: HTTP %{http_code}\n" https://app.molagent.ai/

  # The single-binary daemon (swe/features/single-binary-daemon.md). A separate job so that npm,
  # Docker and the deploy never wait for it or fail because of it; it builds the commit the release
  # job pushed. Explicit condition: it runs when that commit exists, even if a later step of the
  # release job (the production check) failed.
  binaries:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.commit != '' }}
    uses: ./.github/workflows/daemon-binaries.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: ${{ needs.release.outputs.commit }}
      publish: true
    permissions:
      contents: write
