[package]
name = "pistudiodesktop-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Secrets are kept natively (the OS keychain or a file); the browser build has none, so on wasm32
# the crate is empty, like `store`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pistudiodesktop-model = { workspace = true }
pistudiodesktop-store = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
keyring-core = { workspace = true }

# One store crate per platform, so a build pulls no other platform's code. The Linux one is the
# pure-Rust Secret Service client (no libdbus).
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
