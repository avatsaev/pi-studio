[workspace]
resolver = "3"
members = ["crates/*", "apps/pistudiodesktop/src-tauri", "apps/pistudiodesktop-cli", "apps/ipc-bench", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal: one line per crate, so members write `pistudiodesktop-model = { workspace = true }`
pistudiodesktop-model = { path = "crates/model" }
pistudiodesktop-store = { path = "crates/store" }
pistudiodesktop-secrets = { path = "crates/secrets" }
pistudiodesktop-engine = { path = "crates/engine" }
pistudiodesktop-shell = { path = "crates/shell" }
pistudiodesktop-net = { path = "crates/net" }
pistudiodesktop-transfer = { path = "crates/transfer" }
pistudiodesktop-relay = { path = "crates/relay" }
pistudiodesktop-ssh = { path = "crates/ssh" }
pistudiodesktop-testkit = { path = "crates/testkit" }

# external: versions live here only
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
# `std`: the app installs its own boxed logger.
log = { version = "0.4", features = ["std"] }
getrandom = "0.3"
# The machine's interface addresses, read by the app binary's network watcher (MIT OR BSD-3-Clause; native only).
if-addrs = "0.15"
tempfile = "3"
# The Tauri family moves together: keep `tauri`, `tauri-build` and every `tauri-plugin-*` on the
# same major version, and `@tauri-apps/api` in apps/pistudiodesktop/package.json on the same minor as `tauri`.
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# WebSocket server of the IPC benchmark (apps/ipc-bench); features are chosen by the member.
tokio = "1"
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The `net` crate's TLS to the daemon (MIT OR Apache-2.0, ISC and Apache-2.0 for `ring`; native only): rustls with the
# `ring` provider (no aws-lc-rs: it needs cmake or NASM on Windows), certificates judged by the operating system's
# verifier. `socket2` sets the keepalive; `rcgen` makes the test servers' certificates (dev only).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"
socket2 = { version = "0.6", features = ["all"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# The OS keychain (`secrets`): keyring-core's API and one store crate per platform, chosen by `cfg` in
# the member (the `keyring` wrapper crate would pull the same three and a global default store).
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
# The relay client (`relay`): the NaCl box of relay protocol 2 (`SalsaBox`, MIT OR Apache-2.0, RustCrypto) and the session
# id's hash. Checked byte for byte against the relay fixtures.
crypto_box = { version = "0.9", default-features = false, features = ["salsa20", "alloc"] }
sha2 = "0.10"
# The pairing link's query (`model`): Apache-2.0 OR MIT.
form_urlencoded = "1"
# The SSH client (`ssh`): russh (Apache-2.0) with the `ring` backend, not its default `aws-lc-rs` (cmake or NASM on Windows),
# and `ssh2-config` (MIT) to read `~/.ssh/config`.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
ssh2-config = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

# Dependencies are optimized and carry no debug info: the app stays responsive in dev builds, and
# the target dir and link times shrink. The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
# Line tables keep file:line in panic backtraces but drop variable info (faster links).
# To inspect locals in a debugger: CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

# Never add `panic = "abort"` here, although size guides for Tauri suggest it: the crash guard
# needs unwinding.
[profile.release]
lto = "thin"
codegen-units = 1
