[package]
name = "pistudiodesktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "pistudiodesktop"
description = "Pi Studio: desktop app"

# The workspace lints, with `unsafe_code` at "deny" instead of "forbid": this crate writes no
# unsafe code, but Tauri's macros generate the app context here and must be able to allow it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
pistudiodesktop-engine = { workspace = true }
pistudiodesktop-model = { workspace = true }
pistudiodesktop-net = { workspace = true }
pistudiodesktop-secrets = { workspace = true }
pistudiodesktop-shell = { workspace = true }
pistudiodesktop-transfer = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
if-addrs = { workspace = true }

[dev-dependencies]
# `test`: a mock runtime, to run the page's commands through Tauri's permission check without a window.
tauri = { workspace = true, features = ["test"] }
tempfile = { workspace = true }
# The transfer engine's stand-in daemon (a WebSocket server in the test's own process): tests only, so that no release build compiles it.
pistudiodesktop-transfer = { workspace = true, features = ["testing"] }
# The tests' daemon stand-in and page: a local WebSocket server and client.
tokio = { workspace = true, features = ["net", "time", "sync"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
