<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi-Studio — Chat</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0f1115;
        --bg-panel: #14161a;
        --bg-surface: #1c1f26;
        --bg-hover: #22262f;
        --bg-active: #2a3040;
        --border: #2c313b;
        --border-light: #353b46;
        --text: #d6dae0;
        --text-muted: #7a8394;
        --text-dim: #5b6470;
        --accent: #3f7bd0;
        --accent-bg: #1e3a5f;
        --accent-text: #8ab4f8;
        --green: #27ae60;
        --red: #c0392b;
        --yellow: #f0c674;
        --yellow-bg: #2a2410;
        --font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --radius: 6px;
      }
      body { font: var(--font); background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

      /* ─── Toolbar ─────────────────────────────────────────────────────── */
      .toolbar {
        display: flex; align-items: center; gap: 8px; padding: 6px 12px;
        background: var(--bg-surface); border-bottom: 1px solid var(--border);
        flex-shrink: 0; z-index: 10;
      }
      .toolbar .brand { font-weight: 700; color: var(--accent-text); font-size: 14px; }
      .toolbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
      .toolbar .dot.on { background: var(--green); }
      .toolbar .status { color: var(--text-muted); font-size: 12px; }
      .toolbar input, .toolbar select, .toolbar button { font: inherit; background: var(--bg-panel); color: var(--text); border: 1px solid var(--border-light); border-radius: 4px; padding: 3px 7px; font-size: 12px; }
      .toolbar button { cursor: pointer; }
      .toolbar button:hover { background: var(--bg-hover); }
      .toolbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .toolbar .sep { width: 1px; height: 20px; background: var(--border); }
      .toolbar .provider-group { display: flex; align-items: center; gap: 6px; margin-left: auto; }
      .toolbar .provider-group label { font-size: 11px; color: var(--text-muted); }
      .toolbar .provider-group input[id="chat-cwd"] { min-width: 180px; }

      /* ─── Main layout ─────────────────────────────────────────────────── */
      .main { display: flex; flex: 1; overflow: hidden; }

      /* ─── Left sidebar: sessions ──────────────────────────────────────── */
      .sidebar-left {
        width: 240px; min-width: 180px; background: var(--bg-panel);
        border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0;
      }
      .sidebar-left .header {
        padding: 10px 12px; border-bottom: 1px solid var(--border);
        display: flex; align-items: center; justify-content: space-between;
      }
      .sidebar-left .header h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
      .sidebar-left .header button { font-size: 18px; background: none; border: none; color: var(--accent-text); cursor: pointer; line-height: 1; padding: 0 4px; }
      .session-list { flex: 1; overflow-y: auto; padding: 4px 0; }
      .session-item {
        padding: 8px 12px; cursor: pointer; border-left: 3px solid transparent;
        transition: background 0.1s;
      }
      .session-item:hover { background: var(--bg-hover); }
      .session-item.active { background: var(--bg-active); border-left-color: var(--accent); }
      .session-item .title { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .session-item .meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
      .session-item .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
      .session-item .status-dot.running { background: var(--green); }
      .session-item .status-dot.idle { background: var(--text-dim); }
      .session-item .status-dot.error { background: var(--red); }

      /* ─── Center: chat ─────────────────────────────────────────────────── */
      .center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .chat-area { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }

      .msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
      .msg.user { background: var(--accent-bg); color: #dbe9ff; align-self: flex-end; border-bottom-right-radius: 2px; }
      .msg.assistant { background: var(--bg-surface); color: var(--text); align-self: flex-start; border-bottom-left-radius: 2px; }
      .msg.assistant.streaming { border-left: 2px solid var(--accent); }
      .msg.tool { background: var(--yellow-bg); color: var(--yellow); font-size: 12px; align-self: flex-start; padding: 5px 10px; border-radius: 4px; }
      .msg.tool.completed { opacity: 0.8; }
      .msg.reasoning { background: var(--bg); color: var(--text-muted); font-style: italic; font-size: 12px; align-self: flex-start; padding: 5px 10px; }
      .msg.err { background: #3a1515; color: #ff8a80; align-self: flex-start; }
      .msg .who { font-size: 10px; color: var(--text-dim); display: block; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.03em; }

      /* ─── Composer ──────────────────────────────────────────────────────── */
      .composer {
        padding: 10px 16px; border-top: 1px solid var(--border); background: var(--bg-panel);
        display: flex; gap: 8px; align-items: flex-end;
      }
      .composer textarea {
        flex: 1; font: var(--font); background: var(--bg-surface); color: var(--text);
        border: 1px solid var(--border-light); border-radius: var(--radius); padding: 8px 10px;
        resize: none; min-height: 38px; max-height: 160px; outline: none;
      }
      .composer textarea:focus { border-color: var(--accent); }
      .composer .actions { display: flex; flex-direction: column; gap: 4px; }
      .composer button { font: inherit; font-size: 12px; padding: 6px 14px; border-radius: 4px; border: none; cursor: pointer; }
      .composer .send-btn { background: var(--accent); color: #fff; font-weight: 600; }
      .composer .send-btn:hover { background: #4a8ae0; }
      .composer .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .composer .stop-btn { background: var(--red); color: #fff; }
      .composer .stop-btn:hover { background: #d44; }

      /* ─── Bottom terminal ──────────────────────────────────────────────── */
      .terminal-panel {
        height: 200px; min-height: 80px; border-top: 1px solid var(--border);
        background: var(--bg); display: flex; flex-direction: column;
      }
      .terminal-panel.hidden { height: 0 !important; min-height: 0; overflow: hidden; border-top: none; }
      .terminal-panel.hidden + .resize-handle { display: none; }
      .terminal-panel .term-toolbar {
        display: flex; align-items: center; gap: 6px; padding: 4px 10px;
        background: var(--bg-surface); border-bottom: 1px solid var(--border); font-size: 11px;
      }
      .terminal-panel .term-toolbar span { color: var(--text-muted); }
      .terminal-panel .term-toolbar button { font: inherit; font-size: 11px; background: var(--bg-panel); color: var(--text); border: 1px solid var(--border-light); border-radius: 3px; padding: 1px 6px; cursor: pointer; }
      .term-toggle { font: inherit; font-size: 11px; background: none; border: 1px solid var(--border-light); color: var(--text-muted); border-radius: 3px; padding: 2px 8px; cursor: pointer; margin-left: 4px; }
      .term-toggle:hover { color: var(--text); background: var(--bg-hover); }
      .terminal-output {
        flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 12px; color: #c8d0da;
        white-space: pre-wrap; word-break: break-word;
      }
      .terminal-input-row { display: flex; gap: 4px; padding: 4px 10px; border-top: 1px solid var(--border); }
      .terminal-input-row input { flex: 1; font: var(--font); font-size: 12px; background: var(--bg-surface); color: var(--text); border: 1px solid var(--border-light); border-radius: 3px; padding: 3px 7px; outline: none; }
      .terminal-input-row input:focus { border-color: var(--accent); }

      /* ─── Right sidebar: files ─────────────────────────────────────────── */
      .sidebar-right {
        width: 280px; min-width: 200px; background: var(--bg-panel);
        border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0;
      }
      .sidebar-right .tab-bar {
        display: flex; border-bottom: 1px solid var(--border);
      }
      .sidebar-right .tab-bar button {
        flex: 1; padding: 8px; font: inherit; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.04em; background: none; border: none; border-bottom: 2px solid transparent;
        color: var(--text-muted); cursor: pointer;
      }
      .sidebar-right .tab-bar button.active { color: var(--accent-text); border-bottom-color: var(--accent); }
      .sidebar-right .tab-bar button.refresh-btn { flex: none; width: 32px; font-size: 14px; }
      .sidebar-right .tab-bar button.refresh-btn:hover { color: var(--accent-text); }
      .sidebar-right .tab-content { flex: 1; overflow-y: auto; padding: 8px; }
      .file-item {
        padding: 4px 8px; font-size: 12px; border-radius: 3px; cursor: pointer;
        display: flex; align-items: center; gap: 6px;
      }
      .file-item:hover { background: var(--bg-hover); }
      .file-item .icon { font-size: 14px; width: 16px; text-align: center; flex-shrink: 0; }
      .file-item .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .file-item.dir .name { color: var(--accent-text); }
      .change-item {
        padding: 4px 8px; font-size: 12px; border-radius: 3px;
        display: flex; align-items: center; gap: 6px;
      }
      .change-item .badge { font-size: 10px; padding: 0 4px; border-radius: 3px; font-weight: 600; }
      .change-item .badge.added { background: #1a3a1a; color: #4ade80; }
      .change-item .badge.modified { background: #3a3010; color: var(--yellow); }
      .change-item .badge.deleted { background: #3a1515; color: #ff8a80; }
      .empty-state { color: var(--text-dim); font-size: 12px; text-align: center; padding: 20px; }

      /* ─── Resizer (terminal) ────────────────────────────────────────────── */
      .resize-handle {
        height: 4px; cursor: ns-resize; background: transparent;
        transition: background 0.2s;
      }
      .resize-handle:hover, .resize-handle.active { background: var(--accent); }

      /* ─── Scrollbar ──────────────────────────────────────────────────────── */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #353b46; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #4a5260; }

      /* ─── CWD picker dialog ─────────────────────────────────────────────── */
      .cwd-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100;
        display: flex; align-items: center; justify-content: center;
      }
      .cwd-overlay.hidden { display: none; }
      .cwd-dialog {
        width: 500px; max-width: 90vw; max-height: 70vh; background: var(--bg-panel);
        border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      }
      .cwd-dialog .cwd-header {
        padding: 12px 14px; border-bottom: 1px solid var(--border);
        display: flex; align-items: center; gap: 8px;
      }
      .cwd-dialog .cwd-header h3 { font-size: 13px; margin: 0; flex: 1; }
      .cwd-dialog .cwd-header button { font: inherit; font-size: 18px; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0 4px; line-height: 1; }
      .cwd-dialog .cwd-path {
        padding: 8px 14px; font-size: 12px; color: var(--accent-text); background: var(--bg);
        border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px;
      }
      .cwd-dialog .cwd-path button { font: inherit; font-size: 11px; background: var(--bg-surface); color: var(--text); border: 1px solid var(--border-light); border-radius: 3px; padding: 1px 6px; cursor: pointer; }
      .cwd-dialog .cwd-path input { flex: 1; font: inherit; font-size: 12px; background: var(--bg-surface); color: var(--text); border: 1px solid var(--border-light); border-radius: 3px; padding: 3px 7px; outline: none; }
      .cwd-dialog .cwd-path input:focus { border-color: var(--accent); }
      .cwd-dialog .cwd-list { flex: 1; overflow-y: auto; padding: 4px 0; min-height: 200px; max-height: 400px; }
      .cwd-dialog .cwd-item {
        padding: 6px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 12px;
      }
      .cwd-dialog .cwd-item:hover { background: var(--bg-hover); }
      .cwd-dialog .cwd-item .icon { font-size: 14px; width: 18px; text-align: center; }
      .cwd-dialog .cwd-item .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cwd-dialog .cwd-item.dir .name { color: var(--accent-text); }
      .cwd-dialog .cwd-footer {
        padding: 10px 14px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; justify-content: flex-end;
      }
      .cwd-dialog .cwd-footer button { font: inherit; font-size: 12px; padding: 5px 14px; border-radius: 4px; border: 1px solid var(--border-light); cursor: pointer; background: var(--bg-surface); color: var(--text); }
      .cwd-dialog .cwd-footer button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    </style>
  </head>
  <body>
    <!-- ═══ Toolbar ═══ -->
    <div class="toolbar">
      <span class="brand">Pi-Studio</span>
      <a href="/" style="font-size:11px;color:var(--text-muted);text-decoration:none;opacity:0.7" title="Debug view">← Debug</a>
      <span class="dot" id="dot"></span>
      <span class="status" id="status">disconnected</span>
      <div class="sep"></div>
      <input id="host" value="ws://127.0.0.1:6767" size="20" placeholder="ws://host:port" />
      <input id="password" type="password" placeholder="password" size="10" />
      <button class="primary" id="connect">Connect</button>
      <button id="disconnect" disabled>Disconnect</button>
      <div class="provider-group">
        <label>Provider</label>
        <select id="chat-provider"><option value="pi">pi</option><option value="mock">mock</option></select>
        <label>cwd</label>
        <input id="chat-cwd" value="~" size="28" placeholder="/path/to/project" />
        <button id="cwd-browse" title="Browse for directory" style="font-size:14px;padding:2px 6px">📁</button>
      </div>

    <!-- CWD picker dialog -->
    <div class="cwd-overlay hidden" id="cwd-overlay">
      <div class="cwd-dialog">
        <div class="cwd-header">
          <h3>Select working directory</h3>
          <button id="cwd-close">&times;</button>
        </div>
        <div class="cwd-path">
          <button id="cwd-up">&uarr;</button>
          <input id="cwd-input" value="/" />
          <button id="cwd-go">Go</button>
        </div>
        <div class="cwd-list" id="cwd-list"></div>
        <div class="cwd-footer">
          <button id="cwd-cancel">Cancel</button>
          <button class="primary" id="cwd-select">Select this directory</button>
        </div>
      </div>
    </div>
    </div>

    <!-- ═══ Main layout ═══ -->
    <div class="main">
      <!-- Left sidebar: sessions -->
      <div class="sidebar-left">
        <div class="header">
          <h3>Sessions</h3>
          <button id="new-session" title="New conversation">+</button>
        </div>
        <div class="session-list" id="session-list"></div>
      </div>

      <!-- Center: chat + terminal -->
      <div class="center">
        <div class="chat-area" id="chat-area"></div>
        <div class="composer">
          <textarea id="chat-input" rows="1" placeholder="Ask anything… (Enter to send, Shift+Enter for newline)"></textarea>
          <div class="actions">
            <button class="send-btn" id="chat-send">Send</button>
            <button class="stop-btn" id="chat-stop" style="display:none">Stop</button>
          </div>
          <button class="term-toggle" id="term-toggle" title="Toggle terminal">⌘T</button>
        </div>
        <div class="resize-handle" id="term-resize"></div>
        <div class="terminal-panel hidden" id="terminal-panel">
          <div class="term-toolbar">
            <span>Terminal</span>
            <button id="term-clear">Clear</button>
            <button id="term-new">New</button>
            <button id="term-hide" style="margin-left:auto">Hide ✕</button>
          </div>
          <div class="terminal-output" id="term-output"></div>
          <div class="terminal-input-row">
            <input id="term-input" placeholder="$ type command and press Enter" />
          </div>
        </div>
      </div>

      <!-- Right sidebar: files -->
      <div class="sidebar-right">
        <div class="tab-bar">
          <button class="active" data-tab="files">Files</button>
          <button data-tab="changes">Changes</button>
          <button class="refresh-btn" id="right-refresh" title="Refresh">↻</button>
        </div>
        <div class="tab-content" id="right-content">
          <div class="empty-state">Connect to browse files</div>
        </div>
      </div>
    </div>

    <script>
      // ─── Utilities ──────────────────────────────────────────────────────────────
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]);

      // ─── WebSocket ──────────────────────────────────────────────────────────────
      let ws = null;
      let reqId = 0;
      const pending = new Map();
      const DEFAULT_TIMEOUT = 30000;
      const TURN_TIMEOUT = 30 * 60 * 1000;

      function setConnected(on) {
        $("dot").className = "dot" + (on ? " on" : "");
        $("status").textContent = on ? "connected" : "disconnected";
        $("connect").disabled = on;
        $("disconnect").disabled = !on;
      }

      function doConnect() {
        const host = $("host").value.trim();
        const pw = $("password").value.trim();
        const protos = pw ? ["pi-studio.bearer." + pw] : undefined;
        ws = protos ? new WebSocket(host, protos) : new WebSocket(host);
        ws.onopen = () => {
          ws.send(JSON.stringify({
            type: "hello",
            clientId: "chat-" + Math.random().toString(36).slice(2, 8),
            clientType: "browser",
            protocolVersion: 1,
            capabilities: {},
          }));
        };
        ws.onmessage = (ev) => {
          let env;
          try { env = JSON.parse(ev.data); } catch { return; }
          if (env.type === "status" && env.payload?.status === "server_info") {
            setConnected(true);
            onConnected();
            return;
          }
          if (env.type === "pong") return;
          if (env.type === "session") {
            const m = env.message;
            const rid = m?.requestId;
            if (rid && pending.has(rid)) {
              const { resolve, reject } = pending.get(rid);
              pending.delete(rid);
              if (m.type === "rpc_error") reject(new Error(m.message || "rpc_error"));
              else resolve(m.payload ?? m);
              return;
            }
            handleBroadcast(m);
          }
        };
        ws.onclose = () => { setConnected(false); };
        ws.onerror = () => {};
      }

      function rpc(type, params = {}, timeout = DEFAULT_TIMEOUT) {
        return new Promise((resolve, reject) => {
          if (!ws || ws.readyState !== 1) return reject(new Error("not connected"));
          const requestId = "rq" + (++reqId);
          pending.set(requestId, { resolve, reject });
          ws.send(JSON.stringify({ type: "session", message: { type, requestId, ...params } }));
          setTimeout(() => { if (pending.has(requestId)) { pending.delete(requestId); reject(new Error("timeout")); } }, timeout);
        });
      }

      $("connect").onclick = doConnect;
      $("disconnect").onclick = () => ws && ws.close();

      // ─── Session management ─────────────────────────────────────────────────────
      let sessions = []; // { id, agentId, title, status, messages:[] }
      let activeSessionId = null;

      function createSession() {
        const cwd = $("chat-cwd").value.trim() || "~";
        const id = "s-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
        const session = { id, agentId: null, title: "New chat", status: "idle", messages: [], expectingAgent: false, cwd };
        sessions.unshift(session);
        activeSessionId = id;
        renderSessions();
        renderChat();
        return session;
      }

      function getActive() { return sessions.find(s => s.id === activeSessionId); }

      function switchSession(id) {
        activeSessionId = id;
        const session = getActive();
        if (session?.cwd) $("chat-cwd").value = session.cwd;
        renderSessions();
        renderChat();
      }

      function renderSessions() {
        const list = $("session-list");
        list.innerHTML = "";
        for (const s of sessions) {
          const div = document.createElement("div");
          div.className = "session-item" + (s.id === activeSessionId ? " active" : "");
          const statusCls = s.status === "running" ? "running" : s.status === "error" ? "error" : "idle";
          div.innerHTML = `<div class="title"><span class="status-dot ${statusCls}"></span>${esc(s.title)}</div>
            <div class="meta">${s.cwd || "~"} · ${s.agentId ? s.agentId.slice(0, 8) : "new"} · ${s.messages.filter(m => m.role === "user").length} msgs</div>`;
          div.onclick = () => switchSession(s.id);
          list.appendChild(div);
        }
      }

      // ─── Chat rendering ─────────────────────────────────────────────────────────
      // Each message: { role: "user"|"assistant"|"tool"|"reasoning"|"error", text, status?, tool? }
      let currentBubble = null;
      let currentReasoning = null;
      let toolEls = new Map();

      function renderChat() {
        const area = $("chat-area");
        area.innerHTML = "";
        currentBubble = null;
        currentReasoning = null;
        toolEls = new Map();
        const session = getActive();
        if (!session) { area.innerHTML = '<div class="empty-state">Create a new session to start chatting</div>'; return; }
        // Replay stored messages
        for (const msg of session.messages) {
          const div = document.createElement("div");
          div.className = "msg " + msg.role;
          if (msg.who) div.innerHTML = `<span class="who">${esc(msg.who)}</span>`;
          div.appendChild(document.createTextNode(msg.text));
          area.appendChild(div);
        }
        area.scrollTop = area.scrollHeight;
      }

      function appendBubble(cls, who) {
        const area = $("chat-area");
        const div = document.createElement("div");
        div.className = "msg " + cls;
        if (who) div.innerHTML = `<span class="who">${esc(who)}</span>`;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
        return div;
      }

      function appendText(el, text) {
        el.appendChild(document.createTextNode(text));
        $("chat-area").scrollTop = $("chat-area").scrollHeight;
      }

      // ─── Stream event handling ──────────────────────────────────────────────────
      function handleBroadcast(m) {
        if (!m || typeof m !== "object") return;
        if (m.type === "agent_stream" && m.event) {
          handleAgentStream(m);
          return;
        }
        if (m.type === "agent_update") {
          const session = sessions.find(s => s.agentId === m.agentId);
          if (session) { session.status = m.status; renderSessions(); }
        }
      }

      function handleAgentStream(m) {
        const session = getActive();
        if (!session) return;
        // Match stream to active session
        if (session.agentId && m.agentId !== session.agentId) return;
        if (!session.agentId && session.expectingAgent) {
          session.agentId = m.agentId;
          session.expectingAgent = false;
          renderSessions();
        } else if (!session.agentId) return;

        const e = m.event;
        switch (e.kind) {
          case "turn_started":
            currentBubble = null;
            currentReasoning = null;
            toolEls = new Map();
            session.status = "running";
            $("chat-stop").style.display = "";
            renderSessions();
            break;
          case "assistant_message":
            currentReasoning = null;
            if (!currentBubble) currentBubble = appendBubble("assistant streaming", "assistant");
            appendText(currentBubble, e.text || "");
            break;
          case "reasoning":
            currentBubble = null;
            if (!currentReasoning) currentReasoning = appendBubble("reasoning", "thinking");
            appendText(currentReasoning, e.text || "");
            break;
          case "tool_call": {
            currentBubble = null;
            currentReasoning = null;
            const t = e.tool || {};
            const detail = t.command || t.path || t.query || t.url || t.description || "";
            const key = e.callId || (t.kind + ":" + detail);
            let el = toolEls.get(key);
            if (!el) {
              el = appendBubble("tool", `tool ${t.kind || ""}`);
              if (detail) appendText(el, detail);
              toolEls.set(key, el);
            }
            const who = el.querySelector(".who");
            if (who) who.textContent = `tool ${t.kind || ""}${e.status ? " · " + e.status : ""}`;
            if (e.status === "completed") el.classList.add("completed");
            if (e.status === "error") el.classList.add("err");
            // Show tool output in terminal
            if (e.status === "completed" && detail) {
              appendTerminal(`$ ${detail}\n`);
            }
            // Auto-refresh file panel when file-mutating tools complete
            if (e.status === "completed" && (t.kind === "write" || t.kind === "edit" || t.kind === "shell")) {
              scheduleFileRefresh();
            }
            break;
          }
          case "turn_completed":
            if (currentBubble) {
              currentBubble.classList.remove("streaming");
              // Store finalized message
              const text = currentBubble.textContent.replace(/^assistant/i, "").trim();
              if (text) session.messages.push({ role: "assistant", text, who: "assistant" });
            }
            currentBubble = null;
            currentReasoning = null;
            session.status = "idle";
            $("chat-stop").style.display = "none";
            renderSessions();
            // Refresh file panel at end of turn
            scheduleFileRefresh();
            // Update session title from first assistant response
            if (session.title === "New chat" && session.messages.length > 0) {
              const first = session.messages.find(m => m.role === "assistant");
              if (first) session.title = first.text.slice(0, 40) + (first.text.length > 40 ? "…" : "");
              renderSessions();
            }
            break;
          case "turn_failed":
            appendBubble("err", "error").appendChild(document.createTextNode(e.error || "turn failed"));
            session.status = "error";
            $("chat-stop").style.display = "none";
            currentBubble = null;
            renderSessions();
            break;
          case "turn_canceled":
            if (currentBubble) currentBubble.classList.remove("streaming");
            appendBubble("reasoning", "").appendChild(document.createTextNode("(canceled)"));
            session.status = "idle";
            $("chat-stop").style.display = "none";
            currentBubble = null;
            renderSessions();
            break;
          case "error":
            appendBubble("err", "error").appendChild(document.createTextNode(e.message || "error"));
            break;
        }
      }

      // ─── Send message ───────────────────────────────────────────────────────────
      function sendMessage() {
        const input = $("chat-input");
        const text = input.value.trim();
        if (!text) return;
        if (!ws || ws.readyState !== 1) return;

        let session = getActive();
        if (!session) session = createSession();

        input.value = "";
        autoResize(input);
        session.messages.push({ role: "user", text, who: "you" });
        appendBubble("user", "you").appendChild(document.createTextNode(text));

        if (!session.agentId) {
          session.expectingAgent = true;
          const cwd = session.cwd || $("chat-cwd").value.trim() || "~";
          session.cwd = cwd;
          rpc("create_agent_request", {
            config: { provider: $("chat-provider").value, cwd },
            initialPrompt: text,
          }, TURN_TIMEOUT)
            .then(r => {
              if (r?.agentId && !session.agentId) {
                session.agentId = r.agentId;
                renderSessions();
              }
            })
            .catch(() => {});
        } else {
          rpc("send_agent_prompt", { agentId: session.agentId, prompt: text }, TURN_TIMEOUT).catch(() => {});
        }
      }

      $("chat-send").onclick = sendMessage;
      $("chat-stop").onclick = () => {
        const session = getActive();
        if (session?.agentId) rpc("interrupt_agent", { agentId: session.agentId }).catch(() => {});
      };
      $("new-session").onclick = () => { createSession(); };

      // Auto-resize textarea
      function autoResize(el) {
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 160) + "px";
      }
      $("chat-input").addEventListener("input", (e) => autoResize(e.target));
      $("chat-input").addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); sendMessage(); }
      });

      // ─── Terminal ───────────────────────────────────────────────────────────────
      let termSlot = null;

      function appendTerminal(text) {
        const out = $("term-output");
        out.appendChild(document.createTextNode(text));
        out.scrollTop = out.scrollHeight;
      }

      async function createTerminal() {
        try {
          const cwd = $("chat-cwd").value.trim() || undefined;
          const r = await rpc("create_terminal_request", { cwd });
          termSlot = r.terminal?.slot ?? r.slot ?? r.entry?.slot ?? null;
          appendTerminal(`[terminal created: slot ${termSlot}]\n`);
        } catch (e) {
          appendTerminal(`[error creating terminal: ${e.message}]\n`);
        }
      }

      $("term-new").onclick = createTerminal;
      $("term-clear").onclick = () => { $("term-output").textContent = ""; };
      function toggleTerminal() {
        const panel = $("terminal-panel");
        panel.classList.toggle("hidden");
        $("term-toggle").textContent = panel.classList.contains("hidden") ? "⌘T" : "✕T";
      }
      $("term-toggle").onclick = toggleTerminal;
      $("term-hide").onclick = toggleTerminal;
      $("term-input").addEventListener("keydown", async (ev) => {
        if (ev.key === "Enter") {
          const cmd = ev.target.value;
          ev.target.value = "";
          if (!termSlot && termSlot !== 0) await createTerminal();
          if (termSlot !== null) {
            appendTerminal(`$ ${cmd}\n`);
            try {
              await rpc("terminal_input", { slot: termSlot, data: cmd + "\n" });
              // Try to capture output after a short delay
              setTimeout(async () => {
                try {
                  const r = await rpc("capture_terminal_request", { slot: termSlot });
                  const text = r.output ?? r.capture ?? r.lines?.join("\n") ?? "";
                  if (text) { $("term-output").textContent = text + "\n"; }
                } catch {}
              }, 300);
            } catch (e) {
              appendTerminal(`[error: ${e.message}]\n`);
            }
          }
        }
      });

      // ─── Right sidebar: files + changes ─────────────────────────────────────────
      let rightTab = "files";
      let fileList = [];
      let changeList = [];
      let currentFilePath = "";

      document.querySelectorAll(".sidebar-right .tab-bar button").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll(".sidebar-right .tab-bar button").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          rightTab = btn.dataset.tab;
          renderRightPanel();
        };
      });

      function renderRightPanel() {
        const content = $("right-content");
        if (rightTab === "files") {
          if (fileList.length === 0) {
            content.innerHTML = '<div class="empty-state">No files loaded</div>';
            return;
          }
          content.innerHTML = currentFilePath
            ? `<div style="padding:4px 8px;font-size:11px;color:var(--text-muted);border-bottom:1px solid var(--border);margin-bottom:4px;cursor:pointer" id="file-up">⬆ ${esc(currentFilePath)}</div>`
            : "";
          for (const f of fileList) {
            const isDir = f.type === "directory";
            const div = document.createElement("div");
            div.className = "file-item" + (isDir ? " dir" : "");
            div.innerHTML = `<span class="icon">${isDir ? "📁" : "📄"}</span><span class="name">${esc(f.name)}</span>`;
            if (isDir) {
              div.onclick = () => loadFiles((currentFilePath ? currentFilePath + "/" : "") + f.name);
            }
            content.appendChild(div);
          }
          const up = document.getElementById("file-up");
          if (up) up.onclick = () => {
            const parent = currentFilePath.split("/").slice(0, -1).join("/");
            loadFiles(parent || $("chat-cwd").value.trim() || "~");
          };
        } else {
          // Changes tab
          if (changeList.length === 0) {
            content.innerHTML = '<div class="empty-state">No changes detected</div>';
            return;
          }
          content.innerHTML = `<div style="padding:4px 8px;font-size:11px;color:var(--text-muted);border-bottom:1px solid var(--border);margin-bottom:4px">${changeList.length} changed file${changeList.length === 1 ? "" : "s"}</div>`;
          for (const c of changeList) {
            const div = document.createElement("div");
            div.className = "change-item";
            const badge = c.status === "added" ? "A" : c.status === "deleted" ? "D" : "M";
            const cls = c.status === "added" ? "added" : c.status === "deleted" ? "deleted" : "modified";
            const staged = c.staged ? ' <span style="font-size:9px;opacity:0.6">staged</span>' : "";
            div.innerHTML = `<span class="badge ${cls}">${badge}</span><span class="name">${esc(c.path)}</span>${staged}`;
            content.appendChild(div);
          }
        }
      }

      async function loadFiles(path) {
        try {
          // The file_explorer_request doesn't expand ~, so resolve it client-side
          const resolved = path === "~" || path.startsWith("~/")
            ? (await resolveHome()) + path.slice(1)
            : path;
          const r = await rpc("file_explorer_request", { path: resolved });
          // Response is { result: { entries: [{name, kind, size, ...}] } }
          const result = r.result ?? r;
          const entries = result.entries ?? result.files ?? result.children ?? [];
          fileList = entries.map(e => ({
            name: typeof e === "string" ? e : (e.name || e.path || ""),
            type: (typeof e === "object" && (e.kind === "directory" || e.type === "directory" || e.isDirectory)) ? "directory" : "file",
          }));
          // Sort: dirs first, then alphabetical
          fileList.sort((a, b) => {
            if (a.type !== b.type) return a.type === "directory" ? -1 : 1;
            return a.name.localeCompare(b.name);
          });
          currentFilePath = resolved;
          rightTab = "files";
          document.querySelectorAll(".sidebar-right .tab-bar button").forEach(b => b.classList.remove("active"));
          document.querySelector('.sidebar-right .tab-bar button[data-tab="files"]').classList.add("active");
          renderRightPanel();
        } catch (e) {
          $("right-content").innerHTML = `<div class="empty-state">Error: ${esc(e.message)}</div>`;
        }
      }

      // Resolve ~ by listing /home and using the first directory found
      let _homeDir = null;
      async function resolveHome() {
        if (_homeDir) return _homeDir;
        try {
          const r = await rpc("file_explorer_request", { path: "/home" });
          const result = r.result ?? r;
          const entries = result.entries ?? [];
          const first = entries.find(e => e.kind === "directory");
          _homeDir = "/home/" + (first?.name || "user");
        } catch { _homeDir = "/tmp"; }
        return _homeDir;
      }
      async function getHomeName() { return (await resolveHome()).split("/").pop(); }

      async function loadChanges() {
        try {
          let cwd = $("chat-cwd").value.trim() || "~";
          if (cwd === "~" || cwd.startsWith("~/")) cwd = (await resolveHome()) + cwd.slice(1);
          const r = await rpc("git_status_request", { cwd });
          if (!r.available) { changeList = []; renderRightPanel(); return; }
          changeList = [];
          // Staged files
          for (const f of (r.staged ?? [])) {
            const st = f.indexStatus === "A" ? "added" : f.indexStatus === "D" ? "deleted" : "modified";
            changeList.push({ path: f.path, status: st, staged: true });
          }
          // Unstaged (modified in worktree)
          for (const f of (r.unstaged ?? [])) {
            const st = f.worktreeStatus === "D" ? "deleted" : "modified";
            changeList.push({ path: f.path, status: st, staged: false });
          }
          // Untracked files
          for (const f of (r.untracked ?? [])) {
            changeList.push({ path: f, status: "added", staged: false });
          }
          renderRightPanel();
        } catch {
          changeList = [];
          renderRightPanel();
        }
      }

      // ─── File panel refresh (debounced) ────────────────────────────────────────
      let _refreshTimer = null;
      function scheduleFileRefresh() {
        // Debounce: wait 600ms after last trigger so rapid tool completions don't spam
        if (_refreshTimer) clearTimeout(_refreshTimer);
        _refreshTimer = setTimeout(() => {
          _refreshTimer = null;
          refreshRightPanel();
        }, 600);
      }
      function refreshRightPanel() {
        if (currentFilePath) loadFiles(currentFilePath);
        else loadFiles($("chat-cwd").value.trim() || "~");
        loadChanges();
      }
      $("right-refresh").onclick = refreshRightPanel;

      // ─── On connected ──────────────────────────────────────────────────────────
      function onConnected() {
        const cwd = $("chat-cwd").value.trim() || "~";
        loadFiles(cwd);
        loadChanges();
        if (sessions.length === 0) createSession();
      }

      // ─── Terminal resize (drag) ─────────────────────────────────────────────────
      (() => {
        const handle = $("term-resize");
        const panel = $("terminal-panel");
        let startY, startH;
        handle.onmousedown = (e) => {
          e.preventDefault();
          startY = e.clientY;
          startH = panel.offsetHeight;
          handle.classList.add("active");
          const onMove = (ev) => {
            const delta = startY - ev.clientY;
            panel.style.height = Math.max(60, startH + delta) + "px";
          };
          const onUp = () => {
            handle.classList.remove("active");
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
          };
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        };
      })();

      // ─── URL params for auto-connect ────────────────────────────────────────────
      (() => {
        const qs = new URLSearchParams(location.search);
        if (qs.get("host")) $("host").value = qs.get("host");
        if (qs.get("password")) $("password").value = qs.get("password");
        if (qs.get("provider")) $("chat-provider").value = qs.get("provider");
        if (qs.get("cwd")) $("chat-cwd").value = qs.get("cwd");
        if (qs.get("connect") === "1") setTimeout(doConnect, 100);
        const say = qs.get("say");
        if (say) {
          const tryStart = () => {
            if (ws && ws.readyState === 1) { $("chat-input").value = say; sendMessage(); }
            else setTimeout(tryStart, 200);
          };
          setTimeout(tryStart, 500);
        }
      })();

      // Sync cwd changes back to the active session and refresh file panels
      $("chat-cwd").addEventListener("change", () => {
        const session = getActive();
        if (session && !session.agentId) {
          session.cwd = $("chat-cwd").value.trim() || "~";
          renderSessions();
        }
        // Refresh file panel with new cwd
        const cwd = $("chat-cwd").value.trim() || "~";
        loadFiles(cwd);
        loadChanges();
      });
      // Also trigger on Enter key in cwd input
      $("chat-cwd").addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") {
          ev.preventDefault();
          $("chat-cwd").dispatchEvent(new Event("change"));
        }
      });

      // ─── CWD picker dialog ─────────────────────────────────────────────────────
      let cwdPickerPath = "/";

      function openCwdPicker() {
        cwdPickerPath = $('chat-cwd').value.trim() || '~';
        $("cwd-overlay").classList.remove("hidden");
        cwdPickerNavigate(cwdPickerPath);
      }

      function closeCwdPicker() {
        $("cwd-overlay").classList.add("hidden");
      }

      async function cwdPickerNavigate(path) {
        if (path === "~" || path.startsWith("~/")) path = (await resolveHome()) + path.slice(1);
        if (!path) path = "/";
        cwdPickerPath = path;
        $("cwd-input").value = path;
        const list = $("cwd-list");
        list.innerHTML = '<div class="empty-state">Loading...</div>';
        try {
          const r = await rpc("file_explorer_request", { path });
          const result = r.result ?? r;
          const entries = (result.entries ?? []).filter(e => e.kind === "directory");
          entries.sort((a, b) => a.name.localeCompare(b.name));
          list.innerHTML = "";
          if (path !== "/") {
            const upItem = document.createElement("div");
            upItem.className = "cwd-item dir";
            upItem.innerHTML = '<span class="icon">⬆</span><span class="name">..</span>';
            upItem.onclick = () => cwdPickerNavigate(path.split("/").slice(0, -1).join("/") || "/");
            list.appendChild(upItem);
          }
          for (const e of entries) {
            const item = document.createElement("div");
            item.className = "cwd-item dir";
            item.innerHTML = `<span class="icon">📁</span><span class="name">${esc(e.name)}</span>`;
            item.onclick = () => cwdPickerNavigate(path === "/" ? "/" + e.name : path + "/" + e.name);
            list.appendChild(item);
          }
          if (entries.length === 0 && path === "/") {
            list.innerHTML = '<div class="empty-state">No directories found</div>';
          }
        } catch (e) {
          list.innerHTML = `<div class="empty-state">Error: ${esc(e.message)}</div>`;
        }
      }

      function cwdPickerSelect() {
        $("chat-cwd").value = cwdPickerPath;
        $("chat-cwd").dispatchEvent(new Event("change"));
        closeCwdPicker();
      }

      $("cwd-browse").onclick = openCwdPicker;
      $("cwd-close").onclick = closeCwdPicker;
      $("cwd-cancel").onclick = closeCwdPicker;
      $("cwd-select").onclick = cwdPickerSelect;
      $("cwd-up").onclick = () => cwdPickerNavigate(cwdPickerPath.split("/").slice(0, -1).join("/") || "/");
      $("cwd-go").onclick = () => cwdPickerNavigate($("cwd-input").value.trim());
      $("cwd-input").addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") { ev.preventDefault(); cwdPickerNavigate($("cwd-input").value.trim()); }
      });
      $("cwd-overlay").onclick = (ev) => { if (ev.target === $("cwd-overlay")) closeCwdPicker(); };

      // Initialize with one session
      createSession();
    </script>
  </body>
</html>
